<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;family=Inter:wght@400;600;700&amp;display=swap');
      .fm{font-family:'Fira Code',monospace}.fs{font-family:'Inter',sans-serif}
      
      /* Global Animation Timeline (12s loop) */
      @keyframes humanPhase {
        0%, 45% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes botPhase {
        0%, 45% { opacity: 0; }
        50%, 95% { opacity: 1; }
        100% { opacity: 0; }
      }
      
      .human-only { animation: humanPhase 12s infinite; }
      .bot-only { animation: botPhase 12s infinite; }

      /* Curvy Cursor Translation */
      @keyframes curvyPath {
        0% { stroke-dashoffset: 240; }
        40%, 100% { stroke-dashoffset: 0; }
      }
      @keyframes curvyDot {
        0% { motion-offset: 0%; opacity: 1; }
        40% { motion-offset: 100%; opacity: 1; }
        45%, 100% { motion-offset: 100%; opacity: 0; }
      }
      .curvy-line { stroke-dasharray: 6,4; animation: curvyPath 4.8s linear infinite; }
      
      /* Straight Bot Cursor Translation (much faster, linear) */
      @keyframes straightPath {
        0%, 50% { stroke-dashoffset: 200; }
        65%, 100% { stroke-dashoffset: 0; }
      }
      .straight-line { stroke-dasharray: 6,4; animation: straightPath 12s linear infinite; }

      /* Radar Sweep */
      @keyframes radarSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .radar-sweep { animation: radarSweep 4s linear infinite; transform-origin: 430px 180px; }

      /* Pulse Alert */
      @keyframes pulseRed {
        0%, 100% { fill: #ef4444; filter: drop-shadow(0 0 2px rgba(239,68,68,0.4)); }
        50% { fill: #b91c1c; filter: drop-shadow(0 0 12px rgba(239,68,68,0.9)); }
      }
      .alert-flash { animation: pulseRed 1s infinite; }

      @keyframes pulseGreen {
        0%, 100% { fill: #10b981; filter: drop-shadow(0 0 2px rgba(16,185,129,0.4)); }
        50% { fill: #047857; filter: drop-shadow(0 0 10px rgba(16,185,129,0.8)); }
      }
      .green-flash { animation: pulseGreen 2.5s ease-in-out infinite; }

      /* Typewriter CLI commands */
      @clipPath id="clip-cmd1" {
        0%, 5% { width: 0; }
        20%, 100% { width: 280px; }
      }
      @keyframes type1 { 0%, 5% { width: 0; } 18%, 100% { width: 245px; } }
      @keyframes type2 { 0%, 40% { width: 0; } 58%, 100% { width: 250px; } }
      .cmd1 { animation: type1 12s linear infinite; }
      .cmd2 { animation: type2 12s linear infinite; }

      @keyframes cursor1Move {
        0%, 5% { transform: translateX(0); opacity: 1; }
        18% { transform: translateX(245px); opacity: 1; }
        22%, 100% { transform: translateX(245px); opacity: 0; }
      }
      @keyframes cursor2Move {
        0%, 40% { transform: translateX(0); opacity: 0; }
        41% { transform: translateX(0); opacity: 1; }
        58% { transform: translateX(250px); opacity: 1; }
        63%, 100% { transform: translateX(250px); opacity: 0; }
      }
      .cur1 { animation: cursor1Move 12s linear infinite, blink 1s step-end infinite; }
      .cur2 { animation: cursor2Move 12s linear infinite, blink 1s step-end infinite; }
      
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

      /* Terminal logs timing */
      @keyframes showL1 { 0%, 21.9% { opacity: 0; } 22%, 100% { opacity: 1; } }
      @keyframes showL2 { 0%, 39.9% { opacity: 0; } 40%, 100% { opacity: 1; } }
      @keyframes showL3 { 0%, 59.9% { opacity: 0; } 60%, 100% { opacity: 1; } }
      @keyframes showL4 { 0%, 69.9% { opacity: 0; } 70%, 100% { opacity: 1; } }
      @keyframes showL5 { 0%, 82.9% { opacity: 0; } 83%, 100% { opacity: 1; } }
      @keyframes showL6 { 0%, 91.9% { opacity: 0; } 92%, 100% { opacity: 1; } }
      .log1 { animation: showL1 12s step-end infinite; }
      .log2 { animation: showL2 12s step-end infinite; }
      .log3 { animation: showL3 12s step-end infinite; }
      .log4 { animation: showL4 12s step-end infinite; }
      .log5 { animation: showL5 12s step-end infinite; }
      .log6 { animation: showL6 12s step-end infinite; }
    </style>

    <!-- Drop Shadows & Glows -->
    <filter id="ds"><feDropShadow dx="0" dy="6" stdDeviation="15" flood-color="#000" flood-opacity=".6"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Gradients -->
    <radialGradient id="bg-violet" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bg-rose" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bg-emerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Clips for typewriter -->
    <clipPath id="clip-c1"><rect class="cmd1" x="20" y="8" width="0" height="20" /></clipPath>
    <clipPath id="clip-c2"><rect class="cmd2" x="20" y="112" width="0" height="20" /></clipPath>
  </defs>

  <!-- Canvas Background -->
  <rect fill="#04050a" width="860" height="520" rx="16" />
  <rect fill="url(#bg-violet)" width="860" height="520" rx="16" />
  <rect fill="url(#bg-rose)" width="860" height="520" rx="16" />
  <rect fill="url(#bg-emerald)" width="860" height="520" rx="16" />

  <!-- Title Header -->
  <text class="fs" x="430" y="30" fill="#a78bfa" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="3" opacity="0.6">BEHAVIORAL BOT DETECTION &amp; SECURE STORAGE</text>

  <!-- ════════════ COLUMN 1: USER INTERACTION PATHS ════════════ -->
  <g transform="translate(30, 60)" filter="url(#ds)">
    <rect width="230" height="240" rx="12" fill="#0d1117" stroke="rgba(124, 92, 246, 0.2)" stroke-width="1.5" />
    <rect width="230" height="24" rx="12" fill="#161b22" />
    <rect y="16" width="230" height="8" fill="#161b22" />
    <text class="fs" x="115" y="15" fill="#8b949e" font-size="9" font-weight="600" text-anchor="middle">Behavioral Interaction</text>

    <!-- Human Interaction Phase -->
    <g class="human-only">
      <text class="fs" x="15" y="45" fill="#10b981" font-size="10" font-weight="600">✔ Human Movement</text>
      <!-- Curvy Path -->
      <path d="M 25 180 Q 75 80 125 170 T 205 100" fill="none" stroke="rgba(16, 185, 129, 0.3)" stroke-width="2" />
      <path class="curvy-line" d="M 25 180 Q 75 80 125 170 T 205 100" fill="none" stroke="#10b981" stroke-width="2.5" />
      
      <!-- Target indicators -->
      <circle cx="25" cy="180" r="3" fill="#8b949e" />
      <circle cx="205" cy="100" r="3" fill="#8b949e" />
      <text class="fm" x="15" y="215" fill="#64748b" font-size="9">Natural curves &amp; timing jitter</text>
    </g>

    <!-- Bot Interaction Phase -->
    <g class="bot-only">
      <text class="fs" x="15" y="45" fill="#ef4444" font-size="10" font-weight="600">⚠ Automated Bot Detected</text>
      <!-- Perfectly straight line path -->
      <line x1="25" y1="180" x2="205" y2="100" stroke="rgba(239, 68, 68, 0.3)" stroke-width="2" />
      <line class="straight-line" x1="25" y1="180" x2="205" y2="100" stroke="#ef4444" stroke-width="2.5" />
      
      <!-- Target indicators -->
      <circle cx="25" cy="180" r="3" fill="#ef4444" />
      <circle cx="205" cy="100" r="3" fill="#ef4444" />
      <text class="fm" x="15" y="215" fill="#f43f5e" font-size="9" font-weight="600">Unnatural straight-line trajectory</text>
    </g>
  </g>

  <!-- Flow link 1 -->
  <path d="M260,180 H340" fill="none" stroke="rgba(124, 92, 246, 0.4)" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="340,176 348,180 340,184" fill="#8b5cf6" opacity="0.6" />

  <!-- ════════════ CENTER: ANALYSIS ENGINE ════════════ -->
  <g transform="translate(430, 180)">
    <!-- Outer concentric status ring -->
    <circle r="72" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="8" />
    
    <!-- Human state: Valid Green -->
    <g class="human-only">
      <circle r="72" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="80,12" opacity="0.6" />
      <circle r="15" class="green-flash" fill="#10b981" filter="url(#glow)" />
      <text class="fs" y="-35" fill="#10b981" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">PASS</text>
      <text class="fs" y="45" fill="#94a3b8" font-size="8.5" font-weight="600" text-anchor="middle">LINEARITY: <tspan fill="#10b981">0.12</tspan></text>
      <text class="fs" y="58" fill="#94a3b8" font-size="8.5" font-weight="600" text-anchor="middle">JITTER: <tspan fill="#10b981">42ms</tspan></text>
    </g>

    <!-- Bot state: Alert Red -->
    <g class="bot-only">
      <circle r="72" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="10,4" opacity="0.7" />
      <circle r="15" class="alert-flash" fill="#ef4444" filter="url(#glow)" />
      <text class="fs" y="-35" fill="#ef4444" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">BOT DETECTED</text>
      <text class="fs" y="45" fill="#f43f5e" font-size="8.5" font-weight="700" text-anchor="middle">LINEARITY: <tspan fill="#ef4444">0.99</tspan></text>
      <text class="fs" y="58" fill="#f43f5e" font-size="8.5" font-weight="700" text-anchor="middle">ACTIVE DEFENSE: <tspan fill="#ef4444">WIPE</tspan></text>
    </g>

    <!-- Radar Sweep overlay -->
    <g class="radar-sweep">
      <line x1="0" y1="0" x2="0" y2="-72" stroke="rgba(167, 139, 250, 0.4)" stroke-width="2" />
    </g>
  </g>

  <!-- Flow link 2 -->
  <path d="M520,180 H600" fill="none" stroke="rgba(6, 182, 212, 0.4)" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="600,176 608,180 600,184" fill="#06b6d4" opacity="0.6" />

  <!-- ════════════ COLUMN 3: SECURED STORAGE VAULT ════════════ -->
  <g transform="translate(600, 60)" filter="url(#ds)">
    <rect width="230" height="240" rx="12" fill="#0d1117" stroke="rgba(6, 182, 212, 0.2)" stroke-width="1.5" />
    <rect width="230" height="24" rx="12" fill="#161b22" />
    <rect y="16" width="230" height="8" fill="#161b22" />
    <text class="fs" x="115" y="15" fill="#8b949e" font-size="9" font-weight="600" text-anchor="middle">Encrypted Storage State</text>

    <!-- Human Phase: Encrypted Storage secure -->
    <g class="human-only" transform="translate(16, 44)">
      <text class="fs" y="12" fill="#10b981" font-size="10.5" font-weight="700">🔒 Vault: Active</text>
      <g transform="translate(0, 32)">
        <text class="fm" font-size="10" fill="#71717a">{</text>
        <text class="fm" y="16" font-size="10" fill="#a5b4fc">  "token": "aes-256:8f3c..."</text>
        <text class="fm" y="32" font-size="10" fill="#a5b4fc">  "user": "session_admin"</text>
        <text class="fm" y="48" font-size="10" fill="#a5b4fc">  "role": "authorized"</text>
        <text class="fm" y="64" font-size="10" fill="#71717a">}</text>
      </g>
      <rect y="138" width="198" height="34" rx="6" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.2)" />
      <text class="fs" x="99" y="158" fill="#10b981" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5">SECURELY ENCRYPTED</text>
    </g>

    <!-- Bot Phase: Wiped Storage -->
    <g class="bot-only" transform="translate(16, 44)">
      <text class="fs" y="12" fill="#ef4444" font-size="10.5" font-weight="700">☠ Vault: WIPED</text>
      <g transform="translate(0, 32)">
        <text class="fm" font-size="10" fill="#ef4444">{}</text>
        <text class="fm" y="22" font-size="9.5" fill="#ef4444" font-weight="700">/* STORAGE WIPE TRIGGERED */</text>
        <text class="fm" y="40" font-size="9" fill="#71717a">// All sessions purged</text>
        <text class="fm" y="54" font-size="9" fill="#71717a">// Encryption keys destroyed</text>
      </g>
      <rect y="138" width="198" height="34" rx="6" fill="rgba(239, 68, 68, 0.08)" stroke="rgba(239, 68, 68, 0.2)" />
      <text class="fs" x="99" y="158" fill="#ef4444" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5">AUTO DEFENSE CLEARED</text>
    </g>
  </g>

  <!-- ════════════ BOTTOM PANEL: LIVE DEVELOPER TERMINAL ════════════ -->
  <g transform="translate(30, 310)" filter="url(#ds)">
    <rect width="800" height="186" rx="10" fill="rgba(13, 17, 23, 0.9)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <rect width="800" height="24" rx="10" fill="#161b22" />
    <rect y="16" width="800" height="8" fill="#161b22" />
    <circle cx="16" cy="12" r="4" fill="#ff5f56" /><circle cx="28" cy="12" r="4" fill="#ffbd2e" /><circle cx="40" cy="12" r="4" fill="#27c93f" />
    <text class="fs" x="400" y="16" fill="#8b949e" font-size="9" font-weight="600" text-anchor="middle">developer-console — bot-proof-storage</text>
    <line x1="0" y1="24" x2="800" y2="24" stroke="rgba(255,255,255,0.05)" stroke-width="1" />

    <!-- Terminal Output -->
    <g transform="translate(20, 32)">
      <!-- Line 1: npm install command -->
      <text class="fm" y="4" font-size="10.5" fill="#58a6ff" font-weight="700">❯</text>
      <text class="fm" x="16" y="4" font-size="10.5" fill="#c9d1d9" clip-path="url(#clip-c1)">npm install bot-proof-storage</text>
      <rect class="cur1" x="16" y="-6" width="7" height="13" fill="#58a6ff" />

      <!-- Success log after installation -->
      <g class="log1">
        <text class="fm" x="16" y="26" fill="#57ab5a">✔ Installed bot-proof-storage@1.0.1 (AES-256 Encrypted &amp; SSR-Safe)</text>
      </g>

      <!-- Line 2: executing bot test script -->
      <g class="log2">
        <text class="fm" y="48" font-size="10.5" fill="#58a6ff" font-weight="700">❯</text>
        <text class="fm" x="16" y="48" font-size="10.5" fill="#c9d1d9" clip-path="url(#clip-c2)">node test-bot-wipe.js</text>
        <rect class="cur2" x="16" y="37" width="7" height="13" fill="#58a6ff" />
      </g>

      <!-- Execution logs -->
      <g class="log3" transform="translate(16, 72)">
        <text class="fm" fill="#8b949e">[Bot-Proof Storage] Initialized. Monitoring behavioral vectors...</text>
      </g>
      <g class="log4" transform="translate(16, 92)">
        <text class="fm" fill="#10b981">✔ Interaction: Human pattern verified. Data decrypted.</text>
      </g>
      <g class="log5" transform="translate(16, 114)">
        <text class="fm" fill="#ef4444">☠ ALERT: Linear mouse movement detected. Velocity: 140px/ms (Inhuman)</text>
      </g>
      <g class="log6" transform="translate(16, 134)">
        <text class="fm" fill="#f43f5e" font-weight="700">WIPE TRIGGERED: Sensitive client-side storage has been purged safely.</text>
      </g>
    </g>
  </g>
</svg>
